base_url = "https://registry.zentinelproxy.io"
title = "Zentinel Agent Registry"
description = "Browse, discover, and install agents for the Zentinel reverse proxy. 26 agents for security, API protection, scripting, and more."
default_language = "en"

compile_sass = true
generate_feeds = false
build_search_index = false
minify_html = true

[markdown]
smart_punctuation = true
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true

[markdown.highlighting]
style = "class"
dark_theme = "github-dark"
light_theme = "github-light"

[extra]
author = "raskell.io"
github = "https://github.com/zentinelproxy/zentinel"
# discord = ""  # The previous invite (jN57RsT2) expired — Discord returns
# "Unknown Invite" (code 10006). The templates guard on this key, so the
# Discord links are simply hidden while it is unset. Restore by setting a
# permanent invite (Server Settings -> Invites -> expiry Never).
software_version = "26.08_1"
